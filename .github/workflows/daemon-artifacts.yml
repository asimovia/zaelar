# Build the zaelar-daemon installers on the platforms people install them on (V2-575 · P4).
#
# WHY THIS IS ITS OWN WORKFLOW. `ci.yml` runs the controls on Linux, which is where the engine's tests live and
# where nobody installs the daemon. The daemon's whole promise is "it runs on your Mac or your PC with the
# minimum of installation problems", and the only way to know that is to build it on a Mac and a PC and start
# it there. Everything below is the check that claim really passes on a machine that is not the author's.
#
# AND IT IS THE ONE THING THE AUTHOR COULD NOT DO. The macOS half was verified by hand — build, install,
# launchd accepted the agent, ran it, and it deferred to an already-running instance. The Windows half was
# written blind: there was no Windows and no PowerShell on the machine it was written on. This workflow is what
# turns that from an untested claim into a measured one, and it is why the Windows job parse-checks the
# installer scripts before it does anything else — a syntax error in a PowerShell file is a thing you find at
# install time, on somebody else's computer, in the worst possible mood.
#
# IT PUBLISHES NOTHING BY ITSELF. On a tag the artifacts are attached to the release; otherwise they are build
# artifacts you can download and look at.
#
# WHAT IS SIGNED, AND BY WHOM. Each build job signs its own `SHA256SUMS-<suffix>` with a Sigstore KEYLESS
# signature: the signer is this workflow's GitHub OIDC identity (`.../daemon-artifacts.yml@<ref>`), the
# certificate is short-lived, and the signature is recorded in the public Rekor transparency log. No key exists
# to leak. It also attaches GitHub build-provenance attestations to the binaries the sums list. That proves
# "these bytes were built by this workflow, from this repository, at this ref" — it does NOT prove the code was
# reviewed, and it is not an operating-system signature: Apple Developer ID and Windows Authenticode need an
# identity only the publisher holds, and are a later, separate step (see the ops playbook).

name: daemon artifacts

on:
  push:
    tags: ["v*", "daemon-v*"]
    paths:
      - "daemon/**"
      - ".github/workflows/daemon-artifacts.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ APPLE SILICON AND INTEL ARE TWO BINARIES. A PyInstaller bundle carries a real interpreter
          # compiled for one architecture; there is no build that runs on both, and getting it wrong does not
          # degrade — it fails with "bad CPU type in executable", which every user reads as a broken download.
          # `macos-latest` has been arm64 since macos-14, so without this second job an Intel Mac got nothing.
          - os: macos-latest
            artifact: Zaelar.zip
            suffix: macos
          - os: macos-15-intel
            artifact: Zaelar.zip
            suffix: macos-x86_64
          - os: windows-latest
            artifact: zaelar-daemon.exe
            suffix: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Least privilege, stated rather than inherited. `id-token: write` lets the job ask GitHub for the OIDC token
    # Sigstore turns into a signing certificate; `attestations: write` stores the provenance. The build never
    # writes to the repository — attaching to a release is the `release` job's, which holds `contents: write`.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The daemon is standard library only and a test enforces it. Proving that here — on a runner with an
      # empty environment — is stronger than proving it in a repo checkout where the engine's venv is next
      # door and an accidental import would resolve.
      - name: The daemon runs on a bare Python, with nothing installed
        shell: bash
        run: |
          set -euo pipefail
          python -c "import daemon, daemon.fs, daemon.http, daemon.security, daemon.browser; print(daemon.VERSION)"
          python -m daemon version
          # Without Playwright it serves files and SAYS it cannot open windows, rather than pretending.
          python -m daemon browser | python -c "import json,sys; b=json.load(sys.stdin)['browser']; assert b['state']=='unsupported', b; print(b)"

      - name: The PowerShell installers parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(Get-ChildItem daemon/packaging/windows/*.ps1) + @(Get-Item daemon/packaging/get.ps1)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; Write-Host "PARSE ERRORS in $($file.Name)"; $errors | ForEach-Object { Write-Host "  $($_.Message)" } }
            else { Write-Host "OK $($file.Name)" }
          }
          if ($failed) { exit 1 }

      - name: The shell installers parse
        if: runner.os == 'macOS'
        run: |
          bash -n daemon/packaging/macos/install.sh
          bash -n daemon/packaging/macos/uninstall.sh
          bash -n daemon/packaging/get.sh

      # The portable build first, because it needs nothing: if this one fails, the failure is ours and not a
      # build tool's.
      - name: Build the portable archive
        run: python daemon/packaging/build.py --zipapp

      # What the installed program bundles (`daemon/requirements.txt`: Playwright and its driver, the tray's GUI
      # library for this OS) plus the build tool. Installed only now, AFTER the bare-Python check above.
      - name: Install what the desktop build bundles, and the build tooling
        run: pip install -r daemon/requirements.txt -r daemon/packaging/requirements-build.txt

      # macOS: `dist/app/Zaelar.app` (onedir, `Info.plist` patched, re-sealed ad hoc) zipped as
      # `dist/daemon/Zaelar.zip`; Windows: `dist/daemon/zaelar-daemon.exe` (onefile).
      - name: Build the standalone program
        run: python daemon/packaging/build.py --standalone

      - name: The app bundle says who it is, lives in the menu bar, and explains its folder prompts (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          P=dist/app/Zaelar.app/Contents/Info.plist
          test "$(plutil -extract CFBundleIdentifier raw "$P")" = "com.zaelar.daemon"
          test "$(plutil -extract LSUIElement raw "$P")" = "true"
          for key in NSDocumentsFolderUsageDescription NSDesktopFolderUsageDescription NSDownloadsFolderUsageDescription; do
            plutil -extract "$key" raw "$P" | grep -q "Zaelar"
          done
          codesign --verify --deep --strict dist/app/Zaelar.app
          test -x dist/app/Zaelar.app/Contents/Resources/playwright/driver/node \
            || test -x dist/app/Zaelar.app/Contents/Frameworks/playwright/driver/node

      # A binary that builds and does not run is worse than no binary: it fails on the user's machine instead
      # of ours. This starts the real artifact, asks it what it is, and — the half that matters — checks it
      # answers over HTTP and that a request naming somebody else's Host is refused. The guards are what the
      # daemon is FOR; shipping a build where they were compiled out would be the worst possible regression.
      # The runners have Google Chrome installed, so the installed-style build must report a browser READY on the
      # `chrome` channel and declare `browser.auth` — the measured rule, through the bundled Playwright.
      - name: The binary actually runs, finds Chrome, and its guards hold (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BIN=dist/app/Zaelar.app/Contents/MacOS/zaelar-daemon
          "$BIN" version
          export ZAELAR_WORKSPACE="$RUNNER_TEMP/ws"
          mkdir -p "$ZAELAR_WORKSPACE/config/daemon"
          printf '{"version":1,"port":45997,"token":"%s","roots":[],"configured":false}' \
            "citoken0123456789012345678901234567890123456789" > "$ZAELAR_WORKSPACE/config/daemon/daemon.json"
          "$BIN" browser | tee "$RUNNER_TEMP/browser.json"
          python -c "import json; b=json.load(open('$RUNNER_TEMP/browser.json'))['browser']; assert b['state']=='ready' and b['channel']=='chrome', b"
          "$BIN" --no-tray &
          for _ in $(seq 1 40); do curl -sf -m1 http://127.0.0.1:45997/health >/dev/null && break; sleep 0.25; done
          curl -sf -m5 http://127.0.0.1:45997/health | tee "$RUNNER_TEMP/health.json" | grep -q '"daemon": "zaelar"'
          grep -q '"browser.auth"' "$RUNNER_TEMP/health.json" || { echo "the installed build does not declare browser.auth"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -m5 -H 'Host: evil.example' \
                 -H 'Authorization: Bearer citoken0123456789012345678901234567890123456789' \
                 http://127.0.0.1:45997/permissions)
          test "$code" = "401" || { echo "the rebind guard did not survive the build (got $code)"; exit 1; }
          kill %1
          wait || true

      # The resident WITH its menu-bar icon (the default of the packaged program) must still serve: the HTTP side
      # binds before the GUI library loads, so an icon that cannot be drawn never costs the daemon.
      - name: The resident starts with its tray and still answers (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          export ZAELAR_WORKSPACE="$RUNNER_TEMP/ws"
          dist/app/Zaelar.app/Contents/MacOS/zaelar-daemon > "$RUNNER_TEMP/tray.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf -m1 http://127.0.0.1:45997/health >/dev/null && break; sleep 0.25; done
          curl -sf -m5 http://127.0.0.1:45997/health | grep -q '"daemon": "zaelar"'
          sleep 2
          kill -0 %1 || { cat "$RUNNER_TEMP/tray.log"; echo "the resident died with its tray"; exit 1; }
          cat "$RUNNER_TEMP/tray.log"
          kill %1

      - name: The binary actually runs and its guards hold (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./dist/daemon/zaelar-daemon.exe version
          $ws = Join-Path $env:RUNNER_TEMP 'ws'
          New-Item -ItemType Directory -Force -Path (Join-Path $ws 'config/daemon') | Out-Null
          $token = 'citoken0123456789012345678901234567890123456789'
          '{"version":1,"port":45997,"token":"' + $token + '","roots":[],"configured":false}' |
            Set-Content -Path (Join-Path $ws 'config/daemon/daemon.json') -Encoding ASCII
          $env:ZAELAR_WORKSPACE = $ws
          $browser = (& ./dist/daemon/zaelar-daemon.exe browser | Out-String | ConvertFrom-Json).browser
          Write-Host "browser: $($browser | ConvertTo-Json -Compress)"
          if ($browser.state -ne 'ready' -or $browser.channel -ne 'chrome') { throw "the installed build found no Chrome: $($browser | ConvertTo-Json -Compress)" }
          $proc = Start-Process -FilePath ./dist/daemon/zaelar-daemon.exe -ArgumentList '--no-tray' -PassThru
          try {
            $up = $false
            foreach ($i in 1..40) {
              try { Invoke-RestMethod -Uri 'http://127.0.0.1:45997/health' -TimeoutSec 1 | Out-Null; $up = $true; break }
              catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $up) { throw "the daemon never answered on 45997" }
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:45997/health' -TimeoutSec 5
            if ($health.daemon -ne 'zaelar') { throw "unexpected /health payload" }
            if ($health.capabilities -notcontains 'browser.auth') { throw "the installed build does not declare browser.auth" }
            $refused = $false
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:45997/permissions' -TimeoutSec 5 `
                -Headers @{ Host = 'evil.example'; Authorization = "Bearer $token" } | Out-Null
            } catch { if ($_.Exception.Response.StatusCode.value__ -eq 401) { $refused = $true } }
            if (-not $refused) { throw "the rebind guard did not survive the build" }
          } finally { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

      # The packaged program's default is the resident WITH its notification-area icon. Built and started here;
      # nobody clicks it on a runner — that is a manual check.
      - name: The resident starts with its tray and still answers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ZAELAR_WORKSPACE = Join-Path $env:RUNNER_TEMP 'ws'
          $proc = Start-Process -FilePath ./dist/daemon/zaelar-daemon.exe -PassThru `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'tray.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'tray.err')
          try {
            $up = $false
            foreach ($i in 1..60) {
              try { Invoke-RestMethod -Uri 'http://127.0.0.1:45997/health' -TimeoutSec 1 | Out-Null; $up = $true; break }
              catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $up) { throw "the resident with its tray never answered" }
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { throw "the resident died with its tray (exit $($proc.ExitCode))" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Content (Join-Path $env:RUNNER_TEMP 'tray.log'), (Join-Path $env:RUNNER_TEMP 'tray.err') -ErrorAction SilentlyContinue
          }

      # ⚠️ PLATFORM-DISTINCT NAMES, and not for tidiness. Both runners produce `zaelar-daemon.pyz`,
      # `manifest.json` and `SHA256SUMS` under those exact names, so the release job — which flattens every
      # downloaded artifact into one upload — had two files claiming each name and whichever landed second won.
      # The download surface needs a URL per platform that does not move between releases, which is the
      # difference between "the icon offers you the installer" and "the icon offers you a coin flip".
      # ⚠️ ONE SCRIPT FOR BOTH SHELLS, and it recomputes the digests rather than renaming a checksum file.
      # `build.py` writes SHA256SUMS under the BUILD names, so renaming only the files leaves a published sums
      # file that names things the release does not contain — which is what shipped in daemon-v0.2.0 and what
      # made the one-line installer refuse to install.
      - name: Name the artifacts after the platform they are for
        run: python daemon/packaging/release_names.py ${{ matrix.suffix }}

      # ⚠️ SIGNED AFTER THE RENAME, NEVER BEFORE. The rename rewrites the sums, so a signature taken earlier
      # would cover a file that is never published — valid, and about nothing. `release_names.py` also deletes
      # any signature left over from an earlier name, so the only bundle beside the sums is the one made here.
      # ONE BUNDLE, NOT .sig + .pem: `SHA256SUMS-<suffix>.sigstore.json` carries the signature, the certificate
      # AND the transparency-log inclusion proof, so a user verifies with one extra file and without trusting a
      # Rekor lookup at install time. It is cosign's default output format and what `--bundle` verifies.
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Sign the checksums (keyless, this workflow's identity)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "dist/daemon/SHA256SUMS-${{ matrix.suffix }}.sigstore.json" \
            "dist/daemon/SHA256SUMS-${{ matrix.suffix }}"

      # The signature is checked here exactly as a user will check it, pinned to THIS run's identity — a bundle
      # that only verifies on the author's laptop is the same untested claim as a binary that only runs there.
      - name: The signature verifies against this workflow's identity
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "dist/daemon/SHA256SUMS-${{ matrix.suffix }}.sigstore.json" \
            --certificate-identity "${{ github.server_url }}/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "dist/daemon/SHA256SUMS-${{ matrix.suffix }}"

      # Provenance for exactly what the sums list — the binary and the portable archive under their published
      # names — so the attestation and the checksum file can never disagree about which files they are about.
      # `gh attestation verify <file> --repo asimovia/zaelar` checks it.
      - name: Attest the build provenance of the published binaries
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: dist/daemon/SHA256SUMS-${{ matrix.suffix }}

      # The installers and the one-line bootstraps are architecture-independent, so exactly ONE job publishes
      # them. Copied from both Mac jobs they would be two files claiming one name in a flattened release, and
      # the whole point of the suffixes above is that no such pair exists.
      - name: Publish the scripts a person actually runs (once)
        if: matrix.suffix == 'macos'
        run: |
          cd dist/daemon
          cp "$GITHUB_WORKSPACE/daemon/packaging/macos/install.sh" zaelar-daemon-install-macos.sh
          cp "$GITHUB_WORKSPACE/daemon/packaging/macos/uninstall.sh" zaelar-daemon-uninstall-macos.sh
          cp "$GITHUB_WORKSPACE/daemon/packaging/windows/install.ps1" zaelar-daemon-install-windows.ps1
          cp "$GITHUB_WORKSPACE/daemon/packaging/windows/uninstall.ps1" zaelar-daemon-uninstall-windows.ps1
          cp "$GITHUB_WORKSPACE/daemon/packaging/get.sh" get.sh
          cp "$GITHUB_WORKSPACE/daemon/packaging/get.ps1" get.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: zaelar-daemon-${{ matrix.suffix }}
          path: |
            dist/daemon/*
          if-no-files-found: error

  release:
    # Only on a tag, and only once both platforms built AND their guards held on the real binary.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
